# Supabase setter gratisprosjekter på pause etter ~7 dager uten aktivitet.
# Denne jobben gjør et lite kall hver 3. dag så prosjektet holder seg våkent.
# Legg inn SUPABASE_URL og SUPABASE_ANON_KEY under GitHub → Settings → Secrets and variables → Actions.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
